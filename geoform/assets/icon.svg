<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark geological theme -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2a3a"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e9c46a"/>
      <stop offset="100%" style="stop-color:#d4a84a"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ea8de"/>
      <stop offset="100%" style="stop-color:#3a8fc8"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b6dd6"/>
      <stop offset="100%" style="stop-color:#7a52b8"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e07a3f"/>
      <stop offset="100%" style="stop-color:#c46230"/>
    </linearGradient>
    <linearGradient id="drillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Geological layers (isometric 3D block) -->
  <g transform="translate(60, 80)">
    <!-- Top surface -->
    <path d="M0,60 L160,0 L320,60 L160,120 Z" fill="url(#layer1)" filter="url(#glow)" opacity="0.95"/>
    <path d="M0,60 L160,0 L320,60 L160,120 Z" fill="none" stroke="#f5d994" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Layer 1 - Cover/Overburden -->
    <path d="M0,60 L160,0 L320,60 L160,120 Z" fill="url(#layer1)" opacity="0.9"/>
    <path d="M0,140 L160,80 L320,140 L160,200 Z" fill="url(#layer2)" opacity="0.9"/>
    <path d="M0,220 L160,160 L320,220 L160,280 Z" fill="url(#layer3)" opacity="0.9"/>
    <path d="M0,300 L160,240 L320,300 L160,360 Z" fill="url(#layer4)" opacity="0.9"/>
    
    <!-- Side faces for 3D effect -->
    <path d="M160,0 L320,60 L320,140 L160,80 Z" fill="url(#layer1)" opacity="0.6"/>
    <path d="M320,60 L320,140 L320,220 L320,140 Z" fill="url(#layer2)" opacity="0.5"/> 
    <path d="M320,140 L320,220 L320,300 L320,220 Z" fill="url(#layer3)" opacity="0.5"/>
    <path d="M320,220 L320,300 L320,380 L320,300 Z" fill="url(#layer4)" opacity="0.5"/>
    
    <path d="M0,60 L0,140 L160,80 L160,0 Z" fill="url(#layer1)" opacity="0.4"/>
    <path d="M0,140 L0,220 L160,160 L160,80 Z" fill="url(#layer2)" opacity="0.4"/>
    <path d="M0,220 L0,300 L160,240 L160,160 Z" fill="url(#layer3)" opacity="0.4"/>
    <path d="M0,300 L0,380 L160,320 L160,240 Z" fill="url(#layer4)" opacity="0.4"/>
    
    <!-- Drill hole through the model -->
    <g transform="translate(120, -20)">
      <!-- Drill trace -->
      <path d="M0,0 L0,400" stroke="url(#drillGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
      <!-- Drill collar at top -->
      <circle cx="0" cy="0" r="10" fill="url(#drillGrad)" stroke="#0d1b2a" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#0d1b2a"/>
      <!-- Assay intervals as small colored rings -->
      <circle cx="0" cy="80" r="9" fill="none" stroke="#e9c46a" stroke-width="3" stroke-dasharray="4,4"/>
      <circle cx="0" cy="140" r="9" fill="none" stroke="#4ea8de" stroke-width="3" stroke-dasharray="4,4"/>
      <circle cx="0" cy="200" r="9" fill="none" stroke="#9b6dd6" stroke-width="3" stroke-dasharray="4,4"/>
      <circle cx="0" cy="280" r="9" fill="none" stroke="#e07a3f" stroke-width="3" stroke-dasharray="4,4"/>
      <circle cx="0" cy="340" r="9" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
    </g>
    
    <!-- Wireframe edges for technical look -->
    <path d="M160,0 L320,60 L320,380 L160,320 L0,380 L0,60 Z" fill="none" stroke="#1e2d3d" stroke-width="1" opacity="0.3"/>
    <path d="M160,0 L0,60" fill="none" stroke="#1e2d3d" stroke-width="1" opacity="0.3"/>
    <path d="M160,80 L0,140" fill="none" stroke="#1e2d3d" stroke-width="1" opacity="0.2"/>
    <path d="M160,160 L0,220" fill="none" stroke="#1e2d3d" stroke-width="1" opacity="0.2"/>
    <path d="M160,240 L0,300" fill="none" stroke="#1e2d3d" stroke-width="1" opacity="0.2"/>
    <path d="M160,320 L0,380" fill="none" stroke="#1e2d3d" stroke-width="1" opacity="0.2"/>
    
    <!-- Top corner markers (survey points) -->
    <circle cx="160" cy="0" r="4" fill="#f5d994" opacity="0.8"/>
    <circle cx="320" cy="60" r="4" fill="#f5d994" opacity="0.8"/>
    <circle cx="160" cy="120" r="4" fill="#f5d994" opacity="0.8"/>
    <circle cx="0" cy="60" r="4" fill="#f5d994" opacity="0.8"/>
  </g>
  
  <!-- "G" monogram in corner -->
  <text x="420" y="470" font-family="system-ui, sans-serif" font-size="80" font-weight="700" fill="#1e2d3d" opacity="0.15">G</text>
</svg>