name: nota
# Anota cada push a main en la bitácora automática de docs/PROYECTO.md (nota del proyecto en Obsidian).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/PROYECTO.md"]  # el commit de la propia Action no vuelve a dispararla

permissions:
  contents: write

jobs:
  nota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar commits a la nota
        run: |
          python3 - <<'EOF'
          import json, os
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          lines = [f"- {c['timestamp'][:10]} · {c['author']['name']} · `{c['id'][:7]}` {c['message'].splitlines()[0]}"
                   for c in ev["commits"]]
          path = "docs/PROYECTO.md"
          s = open(path, encoding="utf-8").read()
          mark = "<!-- commits -->"
          open(path, "w", encoding="utf-8").write(s.replace(mark, mark + "\n" + "\n".join(reversed(lines)), 1))
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROYECTO.md
          git diff --cached --quiet || git commit -m "Nota: bitácora automática" && git push
